name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run every test file
        run: |
          python3 --version
          failed=0
          for t in test_*.py; do
            echo "::group::$t"
            if python3 "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
